name: Public telemetry
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-telemetry
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generate public telemetry
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build.py --telemetry-only
      - name: Commit changed snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/telemetry.svg assets/resonance.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public telemetry'
            git push
          fi
