<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">afterburnerr — the 03:17 repository night shift</title>
  <desc id="desc">A tiny night-shift janitor sorts four floating code windows into a crooked archive while a moon watches. The scene loops every ten seconds.</desc>
  <style>
    :root { --ink:#e9e6d7; --muted:#9296ad; --violet:#7c6ee6; --yellow:#ffd166; --cyan:#73d6cf; --rust:#d97b5f; }
    .scene { font-family: 'Courier New', monospace; }
    .grain { opacity:.12; }
    .blink { animation: blink 2.1s steps(2,end) infinite; }
    .flicker { animation: flicker 10s steps(1,end) infinite; }
    .worker { animation: patrol 10s steps(1,end) infinite; transform-box:fill-box; transform-origin:center bottom; }
    .arm { transform-box:fill-box; transform-origin: 8px 5px; animation: reach 10s steps(1,end) infinite; }
    .window-a { animation: windowA 10s steps(1,end) infinite; transform-box:fill-box; transform-origin:center; }
    .window-b { animation: windowB 10s steps(1,end) infinite; transform-box:fill-box; transform-origin:center; }
    .window-c { animation: windowC 10s steps(1,end) infinite; transform-box:fill-box; transform-origin:center; }
    .window-d { animation: windowD 10s steps(1,end) infinite; transform-box:fill-box; transform-origin:center; }
    .dust { animation: dust 10s steps(1,end) infinite; }
    .manual .worker { animation:none; transform:translateX(0); }
    .manual .arm { animation:none; transform:rotate(-28deg); }
    .manual .window-a,.manual .window-b,.manual .window-c,.manual .window-d { animation:none; }
    .manual .window-a { transform:translate(0,0); }
    .manual .window-b { transform:translate(0,0); }
    .manual .window-c { transform:translate(0,0); }
    .manual .window-d { transform:translate(0,0); }
    .manual .dust { animation:none; opacity:.8; }
    .workshop-line { fill:none; stroke:#30385d; stroke-width:6; stroke-linecap:square; }
    .manual .status { fill:var(--yellow); }
    @keyframes blink { 0%,94%{opacity:1} 95%,100%{opacity:.15} }
    @keyframes flicker { 0%,48%,51%,100%{opacity:1} 49%,50%{opacity:.45} }
    @keyframes patrol { 0%,8%{transform:translateX(0)} 10%,28%{transform:translateX(235px)} 31%,52%{transform:translateX(465px)} 55%,75%{transform:translateX(690px)} 78%,100%{transform:translateX(0)} }
    @keyframes reach { 0%,8%{transform:rotate(20deg)} 10%,28%{transform:rotate(-28deg)} 31%,52%{transform:rotate(26deg)} 55%,75%{transform:rotate(-35deg)} 78%,100%{transform:rotate(20deg)} }
    @keyframes windowA { 0%,8%{transform:translate(0,0) rotate(-2deg)} 10%,28%{transform:translate(32px,66px) rotate(2deg)} 31%,52%{transform:translate(40px,152px) rotate(-3deg)} 55%,100%{transform:translate(0,0) rotate(-2deg)} }
    @keyframes windowB { 0%,28%{transform:translate(0,0) rotate(2deg)} 31%,52%{transform:translate(-28px,96px) rotate(-2deg)} 55%,75%{transform:translate(-32px,175px) rotate(3deg)} 78%,100%{transform:translate(0,0) rotate(2deg)} }
    @keyframes windowC { 0%,52%{transform:translate(0,0) rotate(-2deg)} 55%,75%{transform:translate(28px,95px) rotate(2deg)} 78%,100%{transform:translate(28px,170px) rotate(-1deg)} }
    @keyframes windowD { 0%,75%{transform:translate(0,0) rotate(2deg)} 78%,100%{transform:translate(-25px,115px) rotate(-3deg)} }
    @keyframes dust { 0%,9%,30%,54%,77%{opacity:0} 12%,32%,56%,80%{opacity:.9} 25%,45%,69%,94%{opacity:0} }
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g class="scene">
    <rect width="1200" height="700" fill="#11182f"/>
    <path d="M0 520 Q180 480 350 530 T720 510 T1200 515 V700H0Z" fill="#171d38"/>
    <path d="M0 610H1200" stroke="#2d3455" stroke-width="3"/>
    <g fill="#2b3355" class="flicker">
      <rect x="75" y="82" width="7" height="7"/><rect x="152" y="172" width="4" height="4"/><rect x="1040" y="102" width="6" height="6"/><rect x="1090" y="260" width="4" height="4"/><rect x="910" y="60" width="5" height="5"/><rect x="860" y="205" width="3" height="3"/>
    </g>
    <g transform="translate(938 92)">
      <circle r="52" fill="#ffd166"/><circle cx="20" cy="-16" r="52" fill="#11182f"/>
      <path d="M-33 27h12M-28 37h7" stroke="#e0ab4f" stroke-width="3" opacity=".6"/>
    </g>
    <text x="70" y="92" fill="#9296ad" font-size="16" letter-spacing="4">NIGHT SHIFT / 03:17</text>
    <text x="70" y="130" fill="#e9e6d7" font-size="38" letter-spacing="-1">afterburnerr</text>
    <text x="72" y="157" fill="#7c6ee6" font-size="13" letter-spacing="2">EVERYTHING IS IN THE WRONG WINDOW</text>

    <g aria-label="night workshop fixtures">
      <path class="workshop-line" d="M80 470V285h22M80 330h110M1080 480V300h-22M1080 365H965"/>
      <path d="M80 285h110v14H80zM965 300h115v14H965z" fill="#30385d"/>
      <rect x="105" y="470" width="180" height="92" fill="#1d2542" stroke="#30385d" stroke-width="4"/>
      <path d="M105 500h180M105 530h180" stroke="#30385d" stroke-width="3"/>
      <text x="120" y="492" fill="#9296ad" font-size="11" letter-spacing="2">MISPLACED</text>
      <rect x="905" y="474" width="174" height="88" fill="#1d2542" stroke="#30385d" stroke-width="4"/>
      <path d="M928 474v88M968 474v88M1008 474v88" stroke="#30385d" stroke-width="3"/>
      <path d="M925 458v-38h56v38M1007 458v-68h43v68" fill="none" stroke="#d97b5f" stroke-width="5"/>
      <circle cx="953" cy="430" r="7" fill="#ffd166"/><circle cx="1028" cy="410" r="7" fill="#73d6cf"/>
      <text x="918" y="548" fill="#9296ad" font-size="10">RETURN TO OWNER</text>
      <path d="M300 574h590" stroke="#30385d" stroke-width="7"/>
      <path d="M325 574v30M865 574v30" stroke="#30385d" stroke-width="7"/>
      <rect x="332" y="588" width="50" height="20" fill="#d97b5f"/><rect x="395" y="588" width="28" height="20" fill="#73d6cf"/>
      <path d="M460 592l34-20 34 20-34 20z" fill="#ffd166" opacity=".8"/>
      <text x="610" y="596" fill="#30385d" font-size="12" letter-spacing="3">WORKBENCH 04</text>
    </g>

    <g class="window-a-frame" transform="translate(125 225) rotate(-2)"><g class="window-a">
      <rect width="225" height="142" fill="#202845" stroke="#7c6ee6" stroke-width="3"/><rect width="225" height="24" fill="#7c6ee6"/>
      <circle cx="14" cy="12" r="4" fill="#11182f"/><circle cx="28" cy="12" r="4" fill="#11182f"/><circle cx="42" cy="12" r="4" fill="#11182f"/>
      <text x="15" y="53" fill="#73d6cf" font-size="17">aftsync</text><text x="15" y="78" fill="#9296ad" font-size="12">pulling a moon-sized</text><text x="15" y="96" fill="#9296ad" font-size="12">thread back into place_</text><rect x="15" y="112" width="78" height="5" fill="#ffd166" class="blink"/>
    </g></g>
    <g class="window-b-frame" transform="translate(405 190) rotate(2)"><g class="window-b">
      <rect width="240" height="150" fill="#26233e" stroke="#d97b5f" stroke-width="3"/><rect width="240" height="24" fill="#d97b5f"/>
      <circle cx="14" cy="12" r="4" fill="#11182f"/><circle cx="28" cy="12" r="4" fill="#11182f"/><circle cx="42" cy="12" r="4" fill="#11182f"/>
      <text x="15" y="53" fill="#ffd166" font-size="16">TownyRaids</text><text x="15" y="78" fill="#9296ad" font-size="12">the villages are awake.</text><text x="15" y="96" fill="#9296ad" font-size="12">do not stack the swords_</text><rect x="15" y="116" width="115" height="5" fill="#73d6cf"/>
    </g></g>
    <g class="window-c-frame" transform="translate(690 240) rotate(-2)"><g class="window-c">
      <rect width="250" height="150" fill="#202845" stroke="#73d6cf" stroke-width="3"/><rect width="250" height="24" fill="#73d6cf"/>
      <circle cx="14" cy="12" r="4" fill="#11182f"/><circle cx="28" cy="12" r="4" fill="#11182f"/><circle cx="42" cy="12" r="4" fill="#11182f"/>
      <text x="15" y="53" fill="#e9e6d7" font-size="15">FreeDeepSeekAPI</text><text x="15" y="78" fill="#9296ad" font-size="12">ask it one question:</text><text x="15" y="96" fill="#9296ad" font-size="12">why is the moon in prod?_</text><rect x="15" y="116" width="84" height="5" fill="#7c6ee6"/>
    </g></g>
    <g class="window-d-frame" transform="translate(505 410) rotate(2)"><g class="window-d">
      <rect width="270" height="145" fill="#26233e" stroke="#ffd166" stroke-width="3"/><rect width="270" height="24" fill="#ffd166"/>
      <circle cx="14" cy="12" r="4" fill="#11182f"/><circle cx="28" cy="12" r="4" fill="#11182f"/><circle cx="42" cy="12" r="4" fill="#11182f"/>
      <text x="15" y="53" fill="#d97b5f" font-size="15">warehouse-dashboards</text><text x="15" y="78" fill="#9296ad" font-size="12">aisle 4: one lost chart</text><text x="15" y="96" fill="#9296ad" font-size="12">aisle 7: suspicious fog_</text><rect x="15" y="116" width="142" height="5" fill="#d97b5f"/>
    </g></g>

    <g class="dust" fill="#ffd166"><rect x="367" y="500" width="5" height="5"/><rect x="380" y="475" width="3" height="3"/><rect x="832" y="455" width="4" height="4"/><rect x="850" y="478" width="6" height="6"/></g>
    <g class="worker-frame" transform="translate(180 445)"><g class="worker">
      <ellipse cx="52" cy="166" rx="48" ry="9" fill="#0c1021" opacity=".65"/>
      <rect x="25" y="58" width="56" height="91" rx="10" fill="#7c6ee6" stroke="#e9e6d7" stroke-width="3"/>
      <rect x="19" y="39" width="68" height="33" rx="5" fill="#202845" stroke="#e9e6d7" stroke-width="3"/>
      <rect x="30" y="48" width="10" height="10" fill="#ffd166" class="blink"/><rect x="63" y="48" width="10" height="10" fill="#73d6cf" class="blink"/>
      <path d="M28 149v17M76 149v17" stroke="#d97b5f" stroke-width="11" stroke-linecap="square"/><path d="M19 82H5M87 82h18" stroke="#7c6ee6" stroke-width="12" stroke-linecap="square"/>
      <path class="arm" d="M88 82l24 -9" stroke="#e9e6d7" stroke-width="7" stroke-linecap="square"/>
      <path d="M5 24v-29M5 -5h35" stroke="#d97b5f" stroke-width="5"/><path d="M-1 -3h11" stroke="#ffd166" stroke-width="3" class="status"/>
    </g></g>
    <g transform="translate(70 646)"><circle cx="7" cy="-5" r="5" fill="#73d6cf" class="status"/><text x="22" y="0" fill="#9296ad" font-size="13">sorting quietly / loop 10s</text></g>
    <text x="1130" y="650" text-anchor="end" fill="#2d3455" font-size="12">[ no dashboard survives the night ]</text>
  </g>
</svg>
