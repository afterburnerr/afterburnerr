<text x="964" y="87" fill="#99958d" font-size="10" font-weight="400" class="mono" text-anchor="middle" letter-spacing="2">AFTERBURNER REACTOR / R-01</text>
<text x="964" y="535" fill="#99958d" font-size="10" font-weight="400" class="mono" text-anchor="middle" letter-spacing="2">EXPERIMENTAL · UNCONVENTIONAL</text>
